<!DOCTYPE html>
<html>
<head>
<style>
  body { background-color: #faf6ee; font-family: Inter, sans-serif; }
  h1 { font-family: Fraunces, serif; font-style: italic; font-size: 6rem; letter-spacing: -0.06em; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; }
  .card { border: 1px solid #e5e5e5; border-radius: 40px; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.1); border-left: 4px solid #8b5cf6; }
  .card .inner-card { border: 1px solid #eee; border-radius: 16px; }
  .hero-text { background: linear-gradient(90deg, #6366f1, #06b6d4); -webkit-background-clip: text; color: transparent; }
  .hero-title { background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } }
  .marquee { animation: marquee 8s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  .btn { transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .reveal { opacity: 0; visibility: hidden; }
</style>
</head>
<body>
  <p class="eyebrow">Welcome to our platform</p>
  <h1>We streamline your workflow with powerful enterprise-grade solutions</h1>
  <p class="hero-text">Unlock the power of seamless integration</p>
  <div class="hero-title"></div>
  <button>📊 Get Started Now</button>
  <img src="placeholder.jpg" />
  <div class="card">
    <svg width="48" height="48"></svg>
    <h2>Feature one</h2>
    <div class="inner-card">Nested card content here</div>
  </div>
  <div class="marquee">Not a feature. A platform. Just a tool. No waiting.</div>
  <div class="pulse"></div>
</body>
</html>
