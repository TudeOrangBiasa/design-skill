name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and doc lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run lint:docs
      - run: npm run validate-catalog
      - name: Dispatcher smoke
        run: node scripts/design.mjs --help | grep -q "Usage: design"

  skillspector:
    name: SkillSpector security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install SkillSpector (pinned v2.5.3)
        run: uv tool install git+https://github.com/NVIDIA/SkillSpector.git@v2.5.3
      - name: Scan the skill
        id: scan
        continue-on-error: true
        run: |
          set +e
          skillspector scan . --no-llm --baseline .skillspector-baseline.yaml --format sarif --output skillspector.sarif
          code=$?
          set -e
          echo "scan_exit=$code" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillspector.sarif
      - name: Gate on findings
        run: exit ${{ steps.scan.outputs.scan_exit }}
