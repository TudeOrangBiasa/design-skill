<!doctype html>

<style>

body{width:1200px;height:630px;background:#fdfdfb;color:#14120f;font-family:Georgia,serif;overflow:hidden}
.bg{position:absolute;inset:0;background-image:url("bg/viridian-21.webp");background-size:cover;background-position:center 25%}

.chip2{position:absolute;right:330px;bottom:100px;background:#d6d0ef;border:1px solid rgba(20,18,15,.14);border-radius:14px;padding:18px 22px;transform:rotate(-2deg);font-family:monospace;font-size:14px;color:#14120f}
